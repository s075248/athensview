    <circle cx="24" cy="18" r="8" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Gentle Ocean Waves -->
    <path d="M8 29 C 14 26, 20 32, 26 28 C 32 24, 38 29, 40 28" stroke="#0A4D68" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 36 C 18 33, 24 38, 30 35 C 34 33, 38 36, 40 35" stroke="#05BFDB" stroke-width="2" stroke-linecap="round"/>
