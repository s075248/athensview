      <stop offset="0%" stop-color="#0A4D68"/>
      <stop offset="100%" stop-color="#088395"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D"/>
      <stop offset="100%" stop-color="#F4C785"/>
    </linearGradient>
  </defs>
  <!-- Logo Icon: Tropical Sun & Ocean Wave / Villa Silhouette -->
  <g transform="translate(6, 6)">
