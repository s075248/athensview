  </g>
  <!-- Wordmark -->
  <text x="64" y="27" font-family="'Outfit', 'Montserrat', sans-serif" font-size="20" font-weight="700" fill="#0A4D68" letter-spacing="1.5">ATHENS VIEW</text>
  <text x="65" y="42" font-family="'Outfit', 'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#E0A96D" letter-spacing="4">MALDIVES • GURAIDHOO</text>
